# WormsPy rig configuration. Copy to rig.toml and edit for your rig.
# Every key is optional; omitted keys use the defaults shown here.

[cameras]
# These values are the "Default" camera preset. Other presets are saved from the app.
fps = 10                       # set by the clock camera; the follower fires once per frame
# GPIO wiring (ADR 0006): the clock camera's ExposureActive is output on clock_output_line,
# cabled to the follower's trigger input. Defaults follow FLIR's Blackfly S sync app note.
clock_output_line = "Line2"
follower_trigger_line = "Line3"

[cameras.clock]                # the calcium camera: the acquisition clock
serial = ""                    # e.g. "21234567" (SpinView shows it); required on the rig
name = "gcamp"                 # channel name: file stem and CSV column prefix
role = "fluorescence"          # recorded raw 16-bit (BigTIFF)
pixel_format = "Mono16"
exposure_us = 14000
gain_db = 0

[cameras.follower]             # triggered 1:1 by the clock camera
serial = ""
name = "brightfield"
role = "behaviour"             # recorded lossless FFV1 video
pixel_format = "Mono8"
exposure_us = 5000             # its own, usually shorter to limit motion blur
gain_db = 0

[stage]
# Serial ports of the Zaber controllers (see Zaber Launcher). XY controllers are
# devices 1 (x) and 2 (y) on xy_port; the Z lift is device 1 on z_port.
xy_port = "COM6"
z_port = "COM3"
max_speed_um_s = 2000          # hard cap for any velocity move (joystick, tracking)

[stage.safe_range_um]
# Software never moves outside these ranges, and they are written into the Zaber
# controllers' limit.min / limit.max at startup so the firmware enforces them too.
# Units: µm in stage coordinates.
x = [0, 50400]                 # TSB60E travel
y = [0, 50400]
# IMPORTANT: narrow Z to a range where the objective cannot touch the plate or holder.
z = [0, 20000]                 # VSR20A travel

[gamepad.sticks]
xy_max_um_s = 1000             # full left-stick deflection
z_max_um_s = 100               # full right-stick deflection
deadzone = 0.1
expo = 2.0                     # 1 = linear; 2 = finer control near centre
invert_y = true
invert_z = false

[gamepad.buttons]
# Button name = command. Commands: ToggleTracking, ToggleRecording, SetFocus,
# ReturnToFocus, MarkEvent, StartLive, StopLive, StartRecording, StopRecording, Calibrate
X = "ToggleTracking"
B = "ToggleRecording"
A = "ReturnToFocus"
Y = "SetFocus"

# --- Tracking (ADR 0008) ---------------------------------------------------------------
# Tuning for the tracker. Changes take effect when WormsPy is restarted. Distances are µm on
# the plate; sizes are camera pixels (the reference rig samples ~0.75 µm/px).

[tracking.servo]
gain_per_s = 2.0               # stage speed (µm/s) per µm the worm is off-centre; higher = snappier
deadband_um = 10               # hold still while the worm is this close to the centre
max_speed_um_s = 1500          # never faster than this (must not exceed stage.max_speed_um_s)
max_accel_um_s2 = 3000         # smooth starts and stops; lower if the plate sloshes
feed_forward = 1.0             # follow the worm's own velocity (0 = off, 1 = fully)
velocity_smoothing = 0.2       # 0–1: weight of each new velocity sample (lower = smoother)
max_worm_speed_um_s = 500      # faster apparent jumps are rejected as debris / another worm
jump_margin_um = 100           # extra allowance for estimator jitter and body-shape changes
lost_after_misses = 3          # frames without a plausible target before "Target lost"

[tracking.dark_object]         # "Brightfield silhouette"
threshold = "auto"             # "auto" (Otsu, floored at k_sigma × noise) or grey levels
k_sigma = 4.0                  # floor of the automatic threshold, in noise standard deviations
min_area_px = 3000             # dark blobs smaller than this are debris, not a worm
# max_area_px = 60000          # optional: ignore blobs larger than this (e.g. plate edge)
background_sigma_px = 150      # illumination flattening scale; well above the worm's width
downsample = 2                 # work at 1/2 resolution (faster; the centroid stays sub-pixel)

[tracking.bright_marker]       # "Fluorescent marker"
k_sigma = 8.0                  # threshold = background + k_sigma × noise (automatic per frame)
spot_sigma_px = 2.0            # about the marker's radius; smooths shot noise
min_area_px = 3                # smaller bright specks are ignored

[paths]
data_root = "~/WormsPy_data"   # sessions are created here as <date>_<animal-id>/
# calibration = "calibration.json"   # default: next to this file
# presets = "presets.json"            # camera presets saved from the app; default: next to this file
